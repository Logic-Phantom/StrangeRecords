# =====================================================================
# 기묘한 기록 (StrangeRecords) - AI YouTube Shorts 자동 제작 설정
# API Key 는 이 파일이 아니라 .env 에 작성한다.
# =====================================================================

app:
  name: "기묘한 기록"
  # development: 업로드 제외 전체 제작 / production: YouTube 업로드까지 실행
  # (development 이면 매일 자동 실행돼도 업로드하지 않는다)
  mode: "production"
  timezone: "Asia/Seoul"
  language: "ko"
  # 성공한 작업의 중간 파일(output/work/<job_id>) 삭제 여부
  cleanup_work_files: false

# ---------------------------------------------------------------------
# Gemini (유일한 AI 엔진). 모델명은 여기 한 곳에서만 관리한다.
# 무료 티어 모델/한도는 변경될 수 있으므로 https://ai.google.dev/gemini-api/docs/rate-limits 확인.
# .env 의 GEMINI_MODEL 이 있으면 그 값이 우선한다.
# ---------------------------------------------------------------------
gemini:
  # 사용 가능한 모델 확인: python -m app.main models
  model: "gemini-3.5-flash"
  # 기본 모델이 과부하(503)/한도 초과(429)면 순서대로 전환
  fallback_models: ["gemini-flash-latest", "gemini-2.5-flash", "gemini-flash-lite-latest"]
  temperature: 0.8
  max_output_tokens: 8192
  max_retries: 3          # API 오류(429/5xx/네트워크) 재시도 횟수
  json_retries: 2         # JSON 파싱/검증 실패 시 재요청 횟수 (무한 재시도 금지)
  request_timeout: 120    # 초
  # 자료 조사 단계에서 Google Search grounding 사용 (무료 티어 지원 여부 확인 후 사용)
  use_google_search: false

# ---------------------------------------------------------------------
# 콘텐츠 카테고리
# ---------------------------------------------------------------------
categories:
  - id: "unsolved_mystery"
    name: "미제 사건 및 현실 미스터리"
    examples: ["미제 사건", "실종 사건", "사라진 사람", "이상한 사건", "설명되지 않은 사건"]
    guideline: "실제 사건이므로 공식 기록으로 확인된 사실(FACT)과 추측/가설(UNCONFIRMED)을 반드시 구분한다. 피해자와 유가족을 존중하고 선정적 묘사를 피한다."
    bgm_mood: "dark"
  - id: "strange_phenomena"
    name: "기묘한 현상 및 도시전설"
    examples: ["세계의 기묘한 현상", "도시전설", "이상한 장소", "인터넷 괴담", "미스터리 현상"]
    guideline: "도시전설/괴담은 실제 사건처럼 단정하지 않고 '~라는 이야기가 전해진다'처럼 표현한다. 과학적으로 설명된 현상은 그 설명도 함께 전한다."
    bgm_mood: "dark"
  - id: "legendary_creatures"
    name: "희귀/전설의 생물"
    examples: ["크라켄", "심해 생물", "전설 속 괴수", "미확인 생명체", "고대 생물"]
    guideline: "전설/신화 속 생물은 LEGEND 로, 실존 생물은 FACT 로 명확히 표시한다. 실존 생물의 수치/생태 정보는 확인된 자료 기준으로만 말한다."
    bgm_mood: "mystery"
  - id: "brain_teaser"
    name: "뇌 자극 / 심리테스트 / 밸런스 게임"
    examples: ["심리테스트", "선택형 문제", "밸런스 게임", "착시", "추리", "두뇌 테스트"]
    guideline: "시청자가 직접 답을 고르도록 유도하고 댓글 참여를 요청한다. 심리테스트는 재미용이며 과학적 진단이 아님을 밝힌다. 정답이 있는 문제는 정답과 풀이를 정확히 제시한다."
    bgm_mood: "light"
  - id: "hidden_history"
    name: "역사의 은밀한 이야기"
    examples: ["잘 알려지지 않은 역사", "역사 속 반전", "유명 인물의 숨겨진 이야기", "역사적 사건의 뒷이야기", "의외의 역사적 사실"]
    guideline: "기록으로 확인된 사실 위주로 작성하고, 일화/야사/속설은 그렇게 표시한다. 연도와 인물명을 정확히 쓴다."
    bgm_mood: "mystery"

# ---------------------------------------------------------------------
# 주제 선정 / 중복 방지
# ---------------------------------------------------------------------
topic:
  candidate_count: 8
  max_generation_rounds: 3     # 모든 후보가 중복이면 새로 생성하는 최대 횟수
  history_limit: 300           # 프롬프트/중복 검사에 사용하는 최근 주제 수
  # rotate(가장 오래 안 쓴 카테고리) | random
  # | rotate_performance: 최근 diversity_window 개 카테고리는 쉬고, "오래 안 쓴 정도 60% + 채널 성과 지수 40%" 로 선택.
  #   성과 표본(analytics.min_samples)이 부족하면 rotate 와 똑같이 동작한다.
  category_strategy: "rotate_performance"
  diversity_window: 2

# ---------------------------------------------------------------------
# 외부 트렌드 탐색 (보조 기능: 실패해도 기존 주제 생성 + 중복 검사로 진행)
# ---------------------------------------------------------------------
trends:
  enabled: true
  region: "KR"
  language: "ko"
  max_hints: 6                 # 주제 프롬프트에 넣는 채널 관련 트렌드 힌트 수
  request_timeout: 15
  # 채널 관련성 판단 단어 (카테고리 examples 와 함께 사용). 이 단어가 없는 화제는 힌트로 쓰지 않는다
  channel_keywords: ["미스터리", "미제", "실종", "수수께끼", "괴담", "전설", "유령", "괴물", "심해", "생물", "멸종", "화석",
                     "고대", "유적", "발굴", "발견", "고고학", "역사", "왕", "전쟁", "비밀", "암호", "착시", "퍼즐", "미확인",
                     "UFO", "운석", "우주", "블랙홀", "현상", "실험", "탐사", "난파", "유령선", "저주", "미라", "피라미드"]
  # 이 단어가 들어간 화제는 힌트로 쓰지 않음 (실제 피해자가 있는 강력 범죄/참사, 정치 이슈)
  exclude_keywords: ["살인", "학대", "성폭", "저격", "피살", "참사", "학살", "자살", "테러", "사망 사고", "선거", "대통령"]
  wikipedia:                   # Wikimedia Pageviews API (무료, Key 불필요)
    enabled: true
    days: 30                   # 최근 7일 평균 ÷ 이전 23일 평균 = 증가 속도
    top_articles: true         # ko 위키백과 전날 인기 문서 → 채널 관련 힌트
    target_daily_views: 3000   # 이 일평균 조회수면 관심도 1.0 (log 정규화)
    min_interval: 1.0          # 요청 사이 최소 간격(초). 몰아서 보내면 429 → 429 를 받으면 이번 실행에서 위키백과 신호 중단
    max_candidates: 5          # 후보 신호를 조회할 최대 후보 수 (덜 비슷한 후보부터, 한국어 문서 우선)
  youtube:                     # YouTube Data API (YOUTUBE_API_KEY 또는 token.json)
    enabled: true
    most_popular: true         # videos.list chart=mostPopular (1 unit). 지역 인기 영상 목록일 뿐 범용 트렌드가 아님
    max_results: 25
    search_per_run: 3          # search.list 는 100 units/회 → 하루 최대 3회 (업로드 1회 약 1,600 units, 일일 10,000)
    search_max_results: 15
    recent_days: 30
  google_trends:               # 공식 API 알파 (승인자만, 엔드포인트 비공개) → 승인 전에는 끔
    enabled: false
    endpoint: ""
  scoring:
    # 0~1 로 정규화한 구성 요소의 가중 평균 (값이 없는 요소는 빠지고 나머지로 재정규화) - 패널티
    weights: {trend: 0.15, velocity: 0.10, channel_fit: 0.15, performance: 0.10, novelty: 0.20, story: 0.15, evidence: 0.15}
    saturation_penalty: 0.15   # 최근 30일 같은 주제 영상 비율 × 이 값
    duplicate_penalty: 0.20    # 기존 주제 중복 기준에 가까운 정도 × 이 값
    min_channel_fit: 0.35      # 이보다 채널 관련성이 낮으면 외부 관심도 미반영
    min_evidence_for_trend: 0.5  # 사실 확인 가능성이 낮은 후보(FICTION 등)는 외부 관심도 미반영
    freshness_half_life_hours: 48

# ---------------------------------------------------------------------
# YouTube Analytics 성과 수집 (token.json 에 yt-analytics.readonly 필요, 없으면 공개 통계만)
# ---------------------------------------------------------------------
analytics:
  enabled: true
  lookback_days: 90            # 게시 후 이 기간 안의 영상만 수집/보고
  max_videos_per_run: 30
  checkpoints_hours: [24, 72, 168]   # 보고서의 시점별 비교 (각 시점 이후 첫 수집값 + 실제 경과 시간)
  min_hours_for_judgement: 48  # 게시 후 이 시간 전에는 성과 판단 보류
  min_samples: 3               # 비교에 필요한 최소 영상 수 (미만이면 "판단 불가", 제작에 반영 안 함)
  shrinkage_k: 5               # 작은 표본을 채널 평균 쪽으로 당기는 강도
  metrics: ["views", "engagedViews", "estimatedMinutesWatched", "averageViewDuration", "averageViewPercentage",
            "likes", "comments", "shares", "subscribersGained", "subscribersLost"]

duplicate:
  # 키워드 겹침(overlap coefficient)이 이 값 이상이면 즉시 중복
  keyword_threshold: 0.67
  # 문자 bigram 유사도가 이 값 이상이면 즉시 중복
  text_threshold: 0.6
  # 이 점수 이상인 기존 주제는 Gemini 의미 판단 대상(shortlist)
  semantic_min_score: 0.2
  semantic_check: true
  semantic_top_k: 5

research:
  enabled: true
  provider: "wikipedia"
  languages: ["ko", "en"]
  max_sources: 4
  max_chars_per_source: 3000
  user_agent: "StrangeRecordsBot/1.0 (YouTube Shorts research; contact: repository owner)"

# ---------------------------------------------------------------------
# 대본
# ---------------------------------------------------------------------
script:
  min_seconds: 40
  max_seconds: 54
  # 한국어 Edge TTS 실측 발화 속도 (공백/문장부호 제외 글자 수, rate +5% 기준 약 4.9자/초)
  chars_per_second: 5.0
  min_scenes: 5
  max_scenes: 9
  banned_phrases: ["충격 실화", "경악", "소름 돋는 진실 100%", "절대 클릭"]
  # 자연스러운 루프 엔딩: 마지막 문장이 사건의 핵심을 회수하면서 첫 문장으로 자연스럽게 이어질 때만 사용
  # (미완성 문장/콜론/결론 숨기기 금지). 품질 점수가 minimum_quality_score 미만이면 일반 결말로 기록
  loop_ending:
    enabled: true
    mode: "natural"            # natural | off
    require_semantic_continuity: true
    minimum_quality_score: 0.75  # 0~1
  quality:
    compare_recent: 30         # 최근 N개 대본과 비교
    max_script_similarity: 0.55  # 이 이상 비슷하면 재생성 (문자 bigram 유사도)
    max_hook_similarity: 0.7   # 첫 문장이 최근 영상과 이만큼 비슷하면 재생성
    max_hook_seconds: 6.0      # 첫 문장 낭독 시간 상한 (경고)
    max_sentence_repeat: 0.85  # 대본 안 문장 반복 판정

# ---------------------------------------------------------------------
# 음성 (Edge TTS)
# ---------------------------------------------------------------------
voice:
  provider: "edge_tts"
  language: "ko-KR"
  voice: "ko-KR-SunHiNeural"   # 또는 ko-KR-InJoonNeural
  rate: "+5%"
  pitch: "+0Hz"
  lead_in: 0.2                 # 첫 음성 전 무음(초)
  scene_gap: 0.2               # Scene 사이 무음(초)
  max_rate_boost: 20           # 길이 초과 시 최대 추가 속도(%)
  # 접속 주소 (앞에서부터 시도, 403 이면 다음 주소). 2026-10 부터 bing 주소는 403 으로 막힘 (edge-tts#490)
  endpoints: ["msedgeservices", "bing"]
  min_interval: 2.5            # 새 주소는 연속 요청에 429 → 요청 사이 최소 간격(초, 실측 2초 이상이면 통과)
  rate_limit_waits: [5, 10, 20, 30, 45]   # 429 를 받으면 차례로 기다렸다가 다시 요청

# ---------------------------------------------------------------------
# 시각자료
# ---------------------------------------------------------------------
assets:
  # 우선순위: ai_image(Gemini AI 장면 이미지, 현재 비활성) → cf_image(Cloudflare Workers AI SDXL, 무료)
  #          → hf_image(Hugging Face SDXL, 크레딧 필요) → pexels → pixabay → local(assets/images, assets/videos) → procedural
  # 앞 provider 가 실패(한도 초과/결제 미연결 등)하면 같은 Scene 에서 바로 다음 provider 로 넘어간다.
  # enabled: false 인 provider 는 건너뛴다.
  providers: ["ai_image", "cf_image", "hf_image", "pexels", "pixabay", "local", "procedural"]
  prefer_video: true
  per_page: 15
  min_short_side: 720
  max_download_mb: 80
  request_timeout: 30
  # 모든 Scene 을 대본(자막) 내용대로 그린 AI 이미지로 채운다. 자체 그래픽(어두운 배경)·스톡 자료로 대체하지 않음.
  # AI 이미지가 빠진 Scene 은 아래 시간(초)만큼 쉬었다가 다시 그리고, 그래도 빠지면 assets 단계를 실패시킨다
  # → 클라우드는 5분/10분 뒤 실패 단계부터 재실행 (이미 그린 Scene 은 data/sources/<job>_assets_partial.json 에서 재사용)
  require_ai_image: true
  ai_retry_waits: [30, 90, 180]
  ai_image:
    # Scene 마다 대본의 visual_prompt 로 Gemini 가 장면 이미지를 생성한다.
    # 무료 티어에서 이미지 모델이 막혀 있으면 Google AI Studio 에서 결제(Billing) 연결 필요.
    # 2026-10-13: 무료 티어는 이미지 한도 0 (매번 429) → 사용하지 않고 Cloudflare / Hugging Face 로 그린다.
    #             결제를 연결한 뒤 다시 쓰려면 true 로 바꾼다.
    enabled: false
    model: "gemini-3.1-flash-image"
    # 모델이 없거나(404) 한도 초과면 순서대로 전환 (python -m app.main models 로 이름 확인)
    fallback_models: ["gemini-2.5-flash-image"]
    # 모든 장면에 공통으로 붙는 화풍 (영상 전체 톤 통일)
    style: "cinematic photorealistic still frame, film grain, 35mm"
  cf_image:
    # Gemini 이미지 실패 시 Cloudflare Workers AI 로 같은 프롬프트(+ ai_image.style)를 그린다.
    # .env 의 CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN 필요 (무료 플랜 하루 10,000 Neurons, SDXL base 는 0원)
    enabled: true
    # 2026-10-13 실측(같은 프롬프트): FLUX.1 schnell 2.4초·장면 내용(예: "풍선 탱크")을 가장 정확히 그림, 단 1024x1024 고정 → 9:16 로 잘라 씀
    #                                SDXL-Lightning 4초·768x1344 / SDXL base 104초(혼잡 시 타임아웃)
    model: "@cf/black-forest-labs/flux-1-schnell"
    # 위 모델이 타임아웃/5xx/거부되면 같은 Scene 에서 순서대로 전환
    fallback_models: ["@cf/bytedance/stable-diffusion-xl-lightning", "@cf/stabilityai/stable-diffusion-xl-base-1.0"]
    width: 768      # 9:16 (SDXL 계열만, FLUX 는 크기 지정 불가)
    height: 1344
    num_steps: 20   # SDXL 최대 20, FLUX 는 최대 8 로 자동 제한
    guidance: 7.5
    negative_prompt: "text, letters, caption, watermark, logo, signature, blurry, lowres, deformed, extra limbs"
    timeout: 180    # 혼잡 시 장당 50~100초 걸림 (2026-10-13 클라우드 실측, 120초에서 타임아웃 발생)
  hf_image:
    # Gemini 이미지 실패 시 Hugging Face Inference API 로 같은 프롬프트(+ ai_image.style)를 그린다.
    # .env 의 HF_API_KEY 필요 (토큰 권한: "Make calls to Inference Providers"). 무료 계정은 월 크레딧 한도 내 사용.
    enabled: true
    model: "stabilityai/stable-diffusion-xl-base-1.0"
    # auto: 이 모델을 서비스하는 Inference Provider 로 자동 라우팅 (hf-inference, fal-ai 등)
    provider: "auto"
    width: 768      # 9:16 (SDXL 권장 해상도), 렌더 단계에서 1080x1920 으로 맞춘다
    height: 1344
    num_inference_steps: 30
    guidance_scale: 7.0
    negative_prompt: "text, letters, caption, watermark, logo, signature, blurry, lowres, deformed, extra limbs"
    timeout: 120

# ---------------------------------------------------------------------
# 자막 (faster-whisper)
# ---------------------------------------------------------------------
subtitle:
  engine: "faster_whisper"
  model_size: "small"          # tiny | base | small | medium | large-v3
  device: "auto"               # auto | cpu | cuda
  compute_type: "int8"
  # script: 대본 텍스트 + Whisper 타이밍 (오탈자 없음) / whisper: 인식 결과 그대로
  text_source: "script"
  max_chars: 13                # 자막 한 덩어리 최대 글자 수 (구절 안에서는 길이를 고르게 나눠 한 어절만 남지 않게 함)
  max_words: 4
  font_path: ""                # 비우면 OS 한글 폰트 자동 탐색 (assets/fonts 우선)
  font_size: 72                # 영어 자막이 함께 들어가므로 92 → 72
  position_y: 0.62             # 화면 높이 대비 한국어 자막 중심 위치 (아래에 영어 자막이 들어갈 자리를 남김)
  color: "#FFFFFF"
  highlight_color: "#FFD43B"
  stroke_color: "#000000"
  stroke_width: 6
  show_title: true             # 상단에 영상 제목 고정 표시
  title_font_size: 64
  title_position_y: 0.13
  # 해외 시청자용 영어 자막: Scene 나레이션 번역문을 한국어 자막 아래에 작게 표시 (SRT 에도 두 줄로 기록)
  english: true
  en_font_size: 38
  en_min_font_size: 30         # 길면 en_max_lines 줄 안에 들어갈 때까지 글자를 줄인다
  en_max_lines: 3
  en_position_y: 0.69          # 영어 자막 블록의 위쪽 끝 (Shorts 하단 UI 에 가리지 않는 위치)
  en_color: "#E6E6E6"
  en_stroke_width: 4

# ---------------------------------------------------------------------
# 영상 (FFmpeg)
# ---------------------------------------------------------------------
video:
  width: 1080
  height: 1920
  fps: 30
  crf: 20
  preset: "medium"
  audio_bitrate: "192k"
  audio_sample_rate: 48000
  transition: "fade"           # fade(xfade) | cut
  transition_type: "fade"      # xfade 효과 이름 (fade, fadeblack, slideleft, ...)
  transition_duration: 0.5    # 장면 사이 크로스페이드(초)
  zoom_amount: 0.12            # Ken Burns 확대 비율
  outro_padding: 0.8           # 마지막 음성 후 여유(초)
  global_fade: 0.4
  # 첫 장면 앞부분에만 거는 시각 Hook 효과 (자막 합성 전 클립에 적용, 이후 장면/자막/오디오는 그대로)
  # preset: subtle(약한 흔들림+대비+노이즈) | vhs(대비+RGB 분리+노이즈) | glitch(흔들림+대비+짧은 RGB 글리치 최대 3회) | impact(강한 흔들림+대비) | none
  # 필요한 FFmpeg 필터가 없으면 그 효과만 빼고, 렌더링이 실패하면 효과 없이 다시 만든다
  hook_effect:
    enabled: true
    duration_seconds: 2.5
    preset: "subtle"
    allow_glitch: true
    allow_noise: true
    allow_shake: true
    deterministic_seed: true   # 같은 작업은 같은 흔들림/글리치 위치 (재렌더링해도 동일)

audio:
  bgm_enabled: true
  bgm_volume: 0.18
  bgm_ducking: true
  sfx_enabled: true
  sfx_volume: 0.55
  max_sfx: 4
  loudnorm: true
  target_lufs: -14

# ---------------------------------------------------------------------
# 품질 검사 (실패 시 업로드 금지)
# ---------------------------------------------------------------------
quality:
  min_duration: 30
  max_duration: 60
  width: 1080
  height: 1920
  fps: 30
  min_file_size_kb: 300
  max_file_size_mb: 256
  max_black_ratio: 0.25
  black_min_duration: 0.5

# ---------------------------------------------------------------------
# 업로드 전 콘텐츠 검수 (critical 이면 업로드 금지 → 작업 상태 review_needed)
# ---------------------------------------------------------------------
review:
  enabled: true
  require_sources_for: ["FACT", "UNCONFIRMED"]   # 이 사실 여부의 주제는 자료 출처 필수
  max_script_similarity: 0.6   # 최근 영상 대본과 이 이상 비슷하면 실질적으로 같은 구성 → critical
  max_title_similarity: 0.75   # 최근 제목과 이 이상 비슷하면 다른 제목 후보로 교체 시도
  template_window: 5           # 최근 N개와 도입 유형+첫 구절이 모두 같으면 반복 템플릿 경고
  max_title_emoji: 1
  min_ending_chars: 8
  max_fix_attempts: 1          # 가벼운 문제(제목)의 자동 수정 횟수

# ---------------------------------------------------------------------
# YouTube
# ---------------------------------------------------------------------
youtube:
  privacy_status: "private"    # publish_mode=private 일 때의 공개 상태
  # public: 업로드 즉시 공개 / scheduled: publish_time 에 예약 공개 / private: 비공개
  # ※ YouTube API 감사(Audit)를 통과하지 않은 프로젝트는 무엇으로 설정해도 YouTube 가 비공개로 잠근다.
  publish_mode: "public"
  publish_time: "12:00"
  # 영상 완성 시점이 이미 예약 시간을 지났을 때: public_now | next_day | private
  late_policy: "public_now"
  min_schedule_margin_minutes: 15
  category_id: "24"            # Entertainment
  made_for_kids: false
  default_language: "ko"
  contains_synthetic_media: true
  client_secrets_file: "credentials.json"
  token_file: "token.json"

schedule:
  enabled: true
  daily_count: 1
  timezone: "Asia/Seoul"
  generate_time: "22:00"       # Windows 작업 스케줄러 등록 시각과 맞출 것 (register_windows_task.ps1)
  upload_time: "12:00"

retry:
  max_attempts: 3
  # 1차 실패 후 5~10초, 2차 실패 후 15~30초 대기
  delays: [[5, 10], [15, 30]]

logging:
  level: "INFO"
