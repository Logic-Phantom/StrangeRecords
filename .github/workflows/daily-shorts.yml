# =====================================================================
# 기묘한 기록 - 매일 22:00(KST) GitHub 서버에서 영상 제작 + YouTube 업로드
# PC 를 켜 두지 않아도 동작한다.
#
# 필요한 Repository secrets (Settings → Secrets and variables → Actions):
#   GEMINI_API_KEY      (필수)
#   YOUTUBE_TOKEN_JSON  (필수) 로컬에서 `python -m app.main auth` 로 만든 token.json 내용 전체
#   CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN (권장) Gemini 이미지 실패 시 무료 AI 이미지
#   HF_API_KEY          (선택) Hugging Face 대체 이미지 (크레딧 필요)
#   PEXELS_API_KEY / PIXABAY_API_KEY (선택)
#   YOUTUBE_API_KEY     (선택) 트렌드 탐색용 YouTube Data API Key (없으면 YOUTUBE_TOKEN_JSON 으로 조회)
#   STATE_DB_KEY        (권장) pipeline-state 브랜치의 DB 를 AES-256 으로 암호화하는 비밀번호.
#                       공개 저장소에서는 DB 에 들어가는 YouTube Analytics 성과(비공개 지표)가 누구에게나 보이므로 설정 권장
#   GOOGLE_TRENDS_API_KEY (선택) Google Trends 공식 API 알파 승인 시에만
#
# 주제 중복 방지/하루 1개 정책/성과 이력에 쓰는 SQLite DB 는 pipeline-state 브랜치에 저장해 다음 실행에 이어 쓴다.
# 실행 순서: DB 복원 → (보조) 이전 영상 성과 수집 → 오늘 영상 제작(트렌드·성과 반영 주제 선정 → 제작 → 검수) → 업로드 → DB 저장
# =====================================================================
name: Daily Shorts

on:
  schedule:
    # 13:07 UTC = 22:07 KST (정각은 GitHub 혼잡으로 지연이 커서 7분 비켜 둠, 그래도 수십 분 늦을 수 있음)
    - cron: "7 13 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "today = 제작 + 업로드 / test = 제작만 (업로드 안 함) / remake = 완료된 작업을 다시 제작 + 업로드"
        type: choice
        options: [today, test, remake]
        default: today
      job:
        description: "remake 할 작업 ID (비우면 오늘 완료된 최근 작업)"
        type: string
        default: ""
      from_step:
        description: "remake 시작 단계 (voice = 음성부터, assets = 이미지부터)"
        type: string
        default: "voice"

concurrency:
  group: daily-shorts
  cancel-in-progress: false

permissions:
  contents: write   # pipeline-state 브랜치에 DB 저장

jobs:
  shorts:
    # ubuntu-latest 는 2026-10-19 부터 Ubuntu 26 으로 바뀌므로 검증된 24.04 로 고정
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GOOGLE_TRENDS_API_KEY: ${{ secrets.GOOGLE_TRENDS_API_KEY }}
      STATE_DB_KEY: ${{ secrets.STATE_DB_KEY }}
      COMMAND: ${{ inputs.command || 'today' }}
      REMAKE_JOB: ${{ inputs.job }}
      REMAKE_FROM: ${{ inputs.from_step || 'voice' }}
    steps:
      - uses: actions/checkout@v5

      - name: Checkout pipeline state
        uses: actions/checkout@v5
        with:
          ref: pipeline-state
          path: .state

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Korean font
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-nanum

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v5
        with:
          path: models
          key: whisper-models-v1

      - name: Restore DB and YouTube token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p data
          if [ -f .state/database.sqlite.enc ]; then
            if [ -z "$STATE_DB_KEY" ]; then echo "::error::암호화된 DB 가 있는데 STATE_DB_KEY secret 이 없습니다"; exit 1; fi
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:STATE_DB_KEY -in .state/database.sqlite.enc -out data/database.sqlite
          elif [ -f .state/database.sqlite ]; then
            cp .state/database.sqlite data/database.sqlite
          fi
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::GEMINI_API_KEY secret 이 없습니다"; exit 1; fi
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json
          elif [ "$COMMAND" = "today" ]; then
            echo "::error::YOUTUBE_TOKEN_JSON secret 이 없습니다 (업로드 불가)"; exit 1
          fi
          python -m app.main setup
          python -m app.main doctor || true

      # 보조 기능: 실패해도(권한 없음, API 오류) 영상 제작/업로드는 계속한다. 성과 수치는 로그에 출력하지 않는다.
      - name: Collect YouTube performance (optional)
        if: env.COMMAND != 'test'
        continue-on-error: true
        timeout-minutes: 10
        run: python -m app.main analytics sync

      - name: Make video (and upload)
        run: |
          if [ "$COMMAND" = "test" ]; then
            python -m app.main test
            exit $?
          fi
          if [ "$COMMAND" = "remake" ]; then
            python -m app.main remake $REMAKE_JOB --from-step "$REMAKE_FROM" && exit 0
            JOB=$(python -c "from app.config.settings import get_settings; from app.database.db import Database; from app.database.repositories import JobRepository; j=JobRepository(Database(get_settings().paths.database)).latest(['failed']); print(j.id if j else '')")
            # 실패하면 실패한 단계부터 이어서 재시도 (그린 이미지는 재사용)
            for attempt in 2 3; do
              echo "::warning::remake 실패 → $((attempt - 1))/2 재시도 대기"
              sleep $(((attempt - 1) * 300))
              python -m app.main retry $JOB && exit 0
            done
            exit 1
          fi
          # 실패하면 같은 서버에서 실패한 단계부터 이어서 재시도 (중간 파일이 남아 있음)
          for attempt in 1 2 3; do
            python -m app.main today && exit 0
            echo "::warning::today 실패 ($attempt/3)"
            [ $attempt -lt 3 ] && sleep $((attempt * 300))
          done
          exit 1

      - name: Save DB to pipeline-state
        if: always()
        run: |
          [ -f data/database.sqlite ] || exit 0
          if [ -n "$STATE_DB_KEY" ]; then
            # 공개 저장소에서도 성과/제작 이력이 보이지 않도록 암호화해서 저장 (평문 DB 는 브랜치에서 제거)
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:STATE_DB_KEY -in data/database.sqlite -out .state/database.sqlite.enc
            git -C .state rm -q --cached --ignore-unmatch database.sqlite
            rm -f .state/database.sqlite
          else
            cp data/database.sqlite .state/database.sqlite
            git -C .state rm -q --cached --ignore-unmatch database.sqlite.enc
            rm -f .state/database.sqlite.enc
          fi
          cd .state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A database.sqlite*
          git diff --cached --quiet || git commit -q -m "state: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') (run ${{ github.run_id }})"
          git push -q origin HEAD:pipeline-state

      - name: Keep video for 3 days
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shorts-${{ github.run_id }}
          path: output/videos/*.mp4
          retention-days: 3
          if-no-files-found: ignore
